name: Deploy repository to Github Pages

on:
  push:
      # Broad on purpose: build_site.sh zips the whole plugin directory, so a new
      # asset file must deploy even when no .js/.css/.yml changed. Do not narrow
      # this to source extensions, and do not add paths-ignore — a workflow that
      # lists both paths and paths-ignore is rejected and fails to start.
      paths:
      - 'plugins/**'
      branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
    - run: |
        chmod +x build_site.sh
        ./build_site.sh _site/${{ github.ref_name }}
    - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
