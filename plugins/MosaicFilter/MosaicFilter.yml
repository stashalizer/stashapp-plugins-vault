name: Mosaic Filter
description: "Movable, resizable blur overlays — rectangle or ellipse, as many independent regions per scene as you need — with follow-cursor and reverse modes that blur everything outside a region. Each filter keeps its own position, size, effect and visibility. Single global config shared by all scenes; scene and studio presets included. Optional: install SuiteData for versioned per-key storage; without it, data falls back to the plugin config."
version: 0.8.1
url: https://github.com/stashalizer/stashapp-plugins-vault
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - MosaicFilterShared.js
    - MosaicFilterStorage.js
    - MosaicFilter.js
    - MosaicFilterSettings.js
  css:
    - MosaicFilter.css
    - MosaicFilterSettings.css
