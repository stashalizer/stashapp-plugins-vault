name: Questing Adventurer
description: Turns scene playback into a quest — build a move/trigger library, then activate triggers via random Penalty/Reward or manual selection. Collapsible, draggable, lockable player overlay plus a full settings page. Optional: install SuiteData for versioned per-key storage; without it, data falls back to the plugin config.
version: 0.13.0
url: https://github.com/stashalizer/stashapp-plugins-vault
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - QuestingAdventurerStorage.js
    - QuestingAdventurer.js
    - QuestingAdventurerSettings.js
  css:
    - QuestingAdventurer.css
    - QuestingAdventurerSettings.css
# requires: CommunityScriptsUILibrary
