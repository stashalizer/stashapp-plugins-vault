name: Audio Support
description: Adds audio file support to Stash via the audio-as-scene path — a setup wizard that enables audio ingestion, a Scene.Create.Post hook that tags audio scenes and extracts metadata, an audio player overlay (direct-stream playback, no broken transcodes), cover-art extraction, an audio browse view, and a generate task that skips audio scenes so preview and sprite generation stops erroring on them. Designed to migrate to the native Audio type once PR #6824 lands.
version: 0.7.4
url: https://github.com/stashalizer/stashapp-plugins-vault
interface: js
exec:
  - AudioSupportHook.js
hooks:
  - name: Tag audio scenes on create
    description: Automatically tags audio-only scenes with the Audio tag when they are created during scan.
    triggeredBy:
      - Scene.Create.Post
tasks:
  - name: Tag all audio scenes
    description: Scans all existing scenes and tags audio-only ones with the Audio tag. Run this once after installing to tag previously-ingested audio scenes.
    defaultArgs:
      mode: tagAll
  - name: Generate (skip audio scenes)
    description: Queues one Stash generate job (previews by default; sprites, phashes, markers and covers are opt-in) for video scenes only. Audio scenes are skipped by tag and by a per-file probe, and any audio scene the probe finds untagged is tagged on the way through. Use this instead of the built-in Generate task on libraries with audio-only scenes. Transcodes are never queued because Stash writes a blank video for audio-only files.
    defaultArgs:
      mode: generateVideo
      tagName: Audio
      sprites: false
      previews: true
      phashes: false
      markers: false
      covers: false
      overwrite: false
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
  - AudioSupport.js
  - AudioSupportSettings.js
  css:
    - AudioSupport.css
    - AudioSupportSettings.css
# requires: CommunityScriptsUILibrary