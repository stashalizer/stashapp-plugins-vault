name: Audio Support
description: Adds audio file support to Stash via the audio-as-scene path — a setup wizard that enables audio ingestion, a Scene.Create.Post hook that tags audio scenes and extracts metadata, an audio player overlay (direct-stream playback, no broken transcodes), cover-art extraction, and an audio browse view. Designed to migrate to the native Audio type once PR #6824 lands.
version: 0.1.0
url: https://github.com/stashalizer/stashapp-plugins-vault
ui:
  requires:
    - CommunityScriptsUILibrary
  javascript:
    - AudioSupport.js
    - AudioSupportSettings.js
  css:
    - AudioSupport.css
    - AudioSupportSettings.css
# requires: CommunityScriptsUILibrary