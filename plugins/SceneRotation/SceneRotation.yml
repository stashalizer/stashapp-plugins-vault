name: Scene Rotation
description: "Per-scene playback rotation. Rotate a scene 90/180/270 degrees clockwise or counter-clockwise and have Stash remember it — the angle is stored in the scene's custom_fields, so it survives reloads, other browsers and other devices. Rotates the video element at playback time: no re-encoding, no extra files in the library."
version: 0.1.0
url: https://github.com/stashalizer/stashapp-plugins-vault
ui:
  javascript:
    - SceneRotation.js
  css:
    - SceneRotation.css
